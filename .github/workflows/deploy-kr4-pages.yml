name: Deploy KR4 to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/css-architecture-states
    paths:
      - "kr4-js-shop/**"
      - ".github/workflows/deploy-kr4-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare KR4 site
        run: |
          mkdir -p _site
          cp -R kr4-js-shop/. _site/
          touch _site/.nojekyll
      - name: Upload KR4 site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
